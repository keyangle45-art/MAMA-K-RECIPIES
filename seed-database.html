<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mama K — Database Seeder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #FAFAFA; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: #fff; border-radius: 20px; border: 1px solid #E8E8E8; padding: 32px; width: 100%; max-width: 560px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  h1 { font-size: 22px; font-weight: 700; color: #1A1A1A; margin-bottom: 4px; }
  .sub { font-size: 14px; color: #8A8A8A; margin-bottom: 24px; }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 5px; font-weight: 500; }
  input { width: 100%; padding: 11px 14px; border: 1px solid #E8E8E8; border-radius: 10px; font-size: 14px; color: #1A1A1A; margin-bottom: 14px; outline: none; font-family: inherit; }
  input:focus { border-color: #CE4F00; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat { background: #FAFAFA; border-radius: 12px; padding: 14px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 700; color: #1A1A1A; }
  .stat-lbl { font-size: 12px; color: #8A8A8A; margin-top: 2px; }
  .progress-track { height: 6px; background: #F0F0F0; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: #CE4F00; border-radius: 3px; width: 0%; transition: width 0.4s ease; }
  .log { background: #1A1A1A; border-radius: 10px; padding: 14px; font-family: 'Monaco', 'Courier New', monospace; font-size: 12px; color: #A0A0A0; height: 160px; overflow-y: auto; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.6; }
  .log .ok { color: #4ADE80; }
  .log .err { color: #F87171; }
  .log .info { color: #60A5FA; }
  .buttons { display: flex; gap: 10px; }
  .btn-start { flex: 1; padding: 12px; background: #CE4F00; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.18s; }
  .btn-start:hover { background: #E06612; }
  .btn-start:disabled { background: #ccc; cursor: not-allowed; }
  .btn-stop { padding: 12px 20px; background: #F5F5F5; border: 1px solid #E8E8E8; border-radius: 10px; font-size: 14px; cursor: pointer; color: #555; }
  .btn-stop:hover { background: #EAEAEA; }
  .done-msg { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 10px; padding: 14px; text-align: center; color: #15803D; font-weight: 600; font-size: 14px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🌶 Mama K Database Seeder</h1>
  <p class="sub">Run once to pre-fill Firestore with 500+ recipes and drinks. Open this file in your browser.</p>

  <label>Site URL</label>
  <input type="text" id="url" value="https://recipes.keyangle.tech" />

  <label>Seed Secret (SEED_SECRET from Vercel)</label>
  <input type="password" id="secret" placeholder="mamak_seed_2026" />

  <div class="stats">
    <div class="stat"><div class="stat-val" id="pct">0%</div><div class="stat-lbl">Progress</div></div>
    <div class="stat"><div class="stat-val" id="count">0</div><div class="stat-lbl">Seeded</div></div>
    <div class="stat"><div class="stat-val" id="remaining">500</div><div class="stat-lbl">Remaining</div></div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="bar"></div></div>

  <div class="log" id="log">Ready. Enter your site URL and secret key, then click Start.\n</div>

  <div class="done-msg" id="done-msg">✓ Database seeded successfully! All recipes and drinks are now in Firestore.</div>

  <div class="buttons">
    <button class="btn-start" id="start-btn" onclick="startSeed()">Start Seeding</button>
    <button class="btn-stop" onclick="stopSeed()">Pause</button>
  </div>
</div>

<script>
let running = false;
let idx = 0;
const TOTAL = 500;
const BATCH = 3;

function addLog(msg, type='') {
  const el = document.getElementById('log');
  const span = document.createElement('span');
  span.className = type;
  span.textContent = msg + '\n';
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

function updateStats(index, rem) {
  const pct = Math.min(100, Math.round((index / TOTAL) * 100));
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('count').textContent = index;
  document.getElementById('remaining').textContent = Math.max(0, rem ?? TOTAL - index);
  document.getElementById('bar').style.width = pct + '%';
}

async function startSeed() {
  const url = document.getElementById('url').value.trim().replace(/\/$/, '');
  const secret = document.getElementById('secret').value.trim();
  if (!url) { addLog('Enter your site URL.', 'err'); return; }
  if (!secret) { addLog('Enter your SEED_SECRET.', 'err'); return; }

  running = true;
  document.getElementById('start-btn').disabled = true;
  addLog('Starting from index ' + idx + '...', 'info');

  while (running) {
    try {
      const res = await fetch(url + '/api/seed', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, startIndex: idx, batchSize: BATCH })
      });

      if (!res.ok) {
        const err = await res.text();
        addLog('Server error ' + res.status + ': ' + err.slice(0, 100), 'err');
        running = false;
        break;
      }

      const data = await res.json();

      if (data.error) {
        addLog('Error: ' + data.error, 'err');
        running = false;
        break;
      }

      if (data.seeded) {
        data.seeded.forEach(r => {
          if (r.error) addLog('  FAIL: ' + r.query + ' — ' + r.error, 'err');
          else addLog('  ✓ [' + r.type + '] ' + r.query, 'ok');
        });
      }

      idx = data.nextIndex || (idx + BATCH);
      updateStats(idx, data.remaining);
      addLog('Progress: ' + (data.progress || '') + ' | ' + (data.remaining || 0) + ' remaining', 'info');

      if (data.done) {
        addLog('\n✓ All done! Database fully seeded.', 'ok');
        document.getElementById('done-msg').style.display = 'block';
        running = false;
        break;
      }

      await new Promise(r => setTimeout(r, 600));

    } catch(e) {
      addLog('Fetch error: ' + e.message + ' — retrying in 3s...', 'err');
      await new Promise(r => setTimeout(r, 3000));
    }
  }

  document.getElementById('start-btn').disabled = false;
}

function stopSeed() {
  running = false;
  addLog('Paused at index ' + idx + '. Click Start to resume.', 'info');
  document.getElementById('start-btn').disabled = false;
}
</script>
</body>
</html>
